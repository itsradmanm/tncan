name: Build and Release Android APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag to upload the APK to (e.g. v1.0.0). Leave empty to just upload as artifact.'
        required: false
        default: 'v1.0.0'

jobs:
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Expo Prebuild
        run: npx expo prebuild --platform android --clean

      - name: Build Android Release APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: |
          mv android/app/build/outputs/apk/release/app-release.apk tncan.apk

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tncan.apk
          path: apps/mobile/tncan.apk

      - name: Upload APK to GitHub Release
        if: ${{ github.event.inputs.release_tag != '' }}
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          files: apps/mobile/tncan.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
